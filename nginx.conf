server {
    listen 5173;
    server_name _;

    location /ws {
        proxy_pass http://localhost:8022;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header REMOTE-HOST $remote_addr;

        proxy_read_timeout 86400;        # 24小时，WebSocket 长连接需要长时间超时
        proxy_send_timeout 86400;        # 24小时
        proxy_connect_timeout 10s;       # 连接超时 10 秒（快速失败）
        proxy_buffering off;              # 禁用缓冲，WebSocket 需要实时传输

        add_header X-Cache $upstream_cache_status;
        add_header Cache-Control no-cache;
    }

    location /api {
        proxy_pass http://localhost:8022;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads {
        proxy_pass http://localhost:8022;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 旧地图路由 -> /web/map。必须放在 SPA fallback 之前：/web/ 是前缀匹配，
    # 会把这些路径直接交给 index.html，前端 redirect 只能改地址栏，拿不到 301。
    # 用精确匹配（=）才不会连 /web/map 自己一起吃掉。return 不会把原始 query
    # 带到新地址上（那是 rewrite 的行为），旧路由的 query 参数在 /map 上也不通用，
    # 丢掉是预期行为；layer=outdoor 由这里显式补。
    location = /web/tracker        { return 301 /web/map; }
    location = /web/config-tracker { return 301 /web/map; }
    location = /web/map-overview   { return 301 /web/map; }
    location = /web/outdoor-map    { return 301 /web/map?layer=outdoor; }

    # location / 也把裸路径交给同一个 SPA，旧书签可能不带 /web 前缀
    location = /tracker            { return 301 /web/map; }
    location = /config-tracker     { return 301 /web/map; }
    location = /map-overview       { return 301 /web/map; }
    location = /outdoor-map        { return 301 /web/map?layer=outdoor; }

    location /web/ {
        alias /usr/share/nginx/html/web/;
        try_files $uri $uri/ /web/index.html;
    }

    location / {
        alias /usr/share/nginx/html/web/;
        try_files $uri $uri/ /web/index.html;
    }


}